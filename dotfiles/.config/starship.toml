"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 800
scan_timeout = 30
palette = "dms"
continuation_prompt = "[∙ ](bold outline)"

format = """
[╭─](bold primary)$os$username$hostname$directory$git_branch$git_status$git_state$package$c$cpp$golang$nodejs$python$rust$java$fill$cmd_duration$status$jobs$time
[╰─](bold primary)$character"""

[palettes.dms]
background = "#111318"
surface = "#1e1f25"
surface_high = "#282a2f"
outline = "#8e9099"
foreground = "#e2e2e9"
muted = "#c4c6d0"
primary = "#adc6ff"
on_primary = "#102f60"
primary_container = "#2b4678"
on_primary_container = "#d8e2ff"
secondary = "#bfc6dc"
green = "#7fff92"
yellow = "#fff872"
red = "#ff7299"
purple = "#debcdf"
cyan = "#dae5ff"

[os]
disabled = false
style = "bold primary"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"

[username]
show_always = false
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "

[directory]
style = "bold fg:on_primary bg:primary"
format = "[](fg:primary)[   $path$read_only ]($style)[](fg:primary) "
home_symbol = ""
read_only = "󰌾"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Desktop" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Videos" = "󰕧 "
"Projects" = "󰲋 "

[git_branch]
symbol = " "
style = "bold fg:#29132d bg:purple"
format = "[](fg:purple)[ $symbol$branch ]($style)[](fg:purple) "
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_state]
style = "bold yellow"
format = "[$state( $progress_current/$progress_total)]($style) "

[package]
symbol = "󰏗 "
style = "bold cyan"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "bold cyan"
format = "[$symbol($version)]($style) "

[cpp]
symbol = " "
style = "bold cyan"
format = "[$symbol($version)]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version)]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version)( \\($virtualenv\\))]($style) "

[rust]
symbol = "󱘗 "
style = "bold red"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "bold red"
format = "[$symbol($version)]($style) "

[fill]
symbol = " "

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bold yellow"
format = "[󱎫 $duration]($style) "

[status]
disabled = false
pipestatus = true
map_symbol = true
symbol = "✘"
success_symbol = ""
not_executable_symbol = "󰂭"
not_found_symbol = "󰍉"
sigint_symbol = "󰚌"
signal_symbol = "󱐋"
style = "bold red"
format = "[$symbol$status]($style) "

[jobs]
symbol = "󰜎"
number_threshold = 1
symbol_threshold = 1
style = "bold purple"
format = "[$symbol$number]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"
